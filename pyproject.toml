[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance-registry"
version = "0.2.0"
description = "GenLayer Intelligent Contract for music provenance — onchain proof of human-made releases"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Skee Mask", email = "dembow1@proton.me"},
]
keywords = ["genlayer", "music", "provenance", "intelligent-contract", "ai-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    # GenLayer Intelligent Contract runtime (provided by the testnet deployer)
    # Uncomment when running on testnet:
    # "py-genlayer>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
]

[tool.setuptools]
packages = ["contracts"]

[tool.setuptools.package-data]
contracts = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
